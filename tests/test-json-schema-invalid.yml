name: Test JSON schema validation with invalid file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: |
            tests/fixtures/schemas/invalid-person.json
          json_schema: tests/fixtures/schemas/person.schema.json
          use_gitignore: "false"
          mode: "fail"
          ajv_strict_mode: "false"

      - name: Assert action failed due to schema violation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success: $SUCCESS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on schema violation but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on schema violation"
