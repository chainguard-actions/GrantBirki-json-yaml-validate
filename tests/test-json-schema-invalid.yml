name: Test JSON schema validation with invalid file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test fixtures directory
        run: mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/json-schema-invalid"

      - name: Create JSON schema file
        run: |
          cat > "$GITHUB_WORKSPACE/tests/fixtures/json-schema-invalid/schema.json" << 'EOF'
          {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "required": ["name", "version"],
            "properties": {
              "name": {
                "type": "string"
              },
              "version": {
                "type": "string"
              }
            },
            "additionalProperties": false
          }
          EOF

      - name: Create JSON file that violates schema (missing required field)
        run: |
          cat > "$GITHUB_WORKSPACE/tests/fixtures/json-schema-invalid/invalid.json" << 'EOF'
          {
            "name": "my-app",
            "unexpected_field": 42
          }
          EOF

      - id: action
        uses: .
        with:
          base_dir: "./tests/fixtures/json-schema-invalid"
          json_schema: "./tests/fixtures/json-schema-invalid/schema.json"
          json_exclude_regex: ".*schema\\.json$"
          mode: "warn"
          use_gitignore: "false"
          ajv_strict_mode: "false"

      - name: Assert success output is false
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "success: $SUCCESS"
          if [ "$SUCCESS" != "false" ]; then
            echo "FAIL: expected success=false for JSON violating schema but got '$SUCCESS'"
            exit 1
          fi
          echo "PASS"
