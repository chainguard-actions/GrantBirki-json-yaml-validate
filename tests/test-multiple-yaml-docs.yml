name: Test multiple YAML documents in single file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test fixtures directory
        run: mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/multi-yaml"

      - name: Create YAML file with multiple documents
        run: |
          cat > "$GITHUB_WORKSPACE/tests/fixtures/multi-yaml/multi.yaml" << 'EOF'
          ---
          name: document-one
          value: 1
          ---
          name: document-two
          value: 2
          EOF

      - id: action
        uses: .
        with:
          base_dir: "./tests/fixtures/multi-yaml"
          allow_multiple_documents: "true"
          use_gitignore: "false"

      - name: Assert success output is true
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "success: $SUCCESS"
          if [ "$SUCCESS" != "true" ]; then
            echo "FAIL: expected success=true for multi-document YAML with allow_multiple_documents=true but got '$SUCCESS'"
            exit 1
          fi
          echo "PASS"
