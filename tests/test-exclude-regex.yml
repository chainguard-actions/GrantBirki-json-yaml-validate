name: Test exclude regex for JSON files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture files with one invalid JSON that should be excluded
        run: |
          mkdir -p tests/fixtures/exclude-regex

          # Create a valid JSON file
          cat > tests/fixtures/exclude-regex/valid.json << 'EOF'
          {
            "name": "valid-file"
          }
          EOF

          # Create an invalid JSON file that will be excluded by regex
          cat > tests/fixtures/exclude-regex/excluded.schema.json << 'EOF'
          {
            "name": "this is invalid json"
            "missing_comma": true
          }
          EOF

      - id: action
        uses: .
        with:
          base_dir: tests/fixtures/exclude-regex
          json_exclude_regex: ".*\\.schema\\.json$"
          use_gitignore: "false"

      - name: Assert success output is true (invalid file was excluded)
        env:
          ACTUAL: ${{ steps.action.outputs.success }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' but got '$ACTUAL' - the excluded file should not have been validated"
            exit 1
          fi
          echo "PASS"
