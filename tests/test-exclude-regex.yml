name: Test JSON exclude regex
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test fixtures directory
        run: mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/exclude-regex"

      - name: Create valid JSON file
        run: |
          cat > "$GITHUB_WORKSPACE/tests/fixtures/exclude-regex/valid.json" << 'EOF'
          {
            "key": "value"
          }
          EOF

      - name: Create invalid JSON file that should be excluded
        run: |
          cat > "$GITHUB_WORKSPACE/tests/fixtures/exclude-regex/excluded.skip.json" << 'EOF'
          {
            this is not valid json at all
          }
          EOF

      - id: action
        uses: .
        with:
          base_dir: "./tests/fixtures/exclude-regex"
          json_exclude_regex: ".*\\.skip\\.json$"
          use_gitignore: "false"

      - name: Assert success output is true (invalid file was excluded)
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "success: $SUCCESS"
          if [ "$SUCCESS" != "true" ]; then
            echo "FAIL: expected success=true because invalid file was excluded by regex, but got '$SUCCESS'"
            exit 1
          fi
          echo "PASS"
