name: Test exclude regex skips invalid files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          base_dir: ./tests/fixtures/invalid
          json_exclude_regex: ".*bad\\.json$"
          yaml_exclude_regex: ".*bad\\.yaml$"
          use_gitignore: "false"
          mode: "fail"

      - name: Assert success output is true (excluded invalid files)
        env:
          ACTUAL: ${{ steps.action.outputs.success }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected success=true when invalid files are excluded, but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: invalid files correctly excluded from validation"
