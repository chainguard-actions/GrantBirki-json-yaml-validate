name: Test exclude regex skips matching files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          base_dir: tests/fixtures/invalid
          json_exclude_regex: ".*bad\\.json$"
          yaml_exclude_regex: ".*bad\\.yaml$"
          use_gitignore: "false"
          mode: "fail"

      - name: Assert success because invalid files were excluded
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success: $SUCCESS"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (invalid files excluded) but outcome was '$OUTCOME'"
            exit 1
          fi
          if [ "$SUCCESS" != "true" ]; then
            echo "FAIL: expected success=true but got '$SUCCESS'"
            exit 1
          fi
          echo "PASS: invalid files were excluded and validation passed"
