name: Test explicit files input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          files: |
            tests/fixtures/valid/sample.json
            tests/fixtures/valid/sample.yaml
            tests/fixtures/valid/sample.yml
          use_gitignore: "false"
          mode: "fail"

      - name: Assert success output is true for explicitly listed valid files
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success: $SUCCESS"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed but outcome was '$OUTCOME'"
            exit 1
          fi
          if [ "$SUCCESS" != "true" ]; then
            echo "FAIL: expected success=true but got '$SUCCESS'"
            exit 1
          fi
          echo "PASS: explicitly listed valid files passed validation"
