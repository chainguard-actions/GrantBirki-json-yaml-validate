name: Test invalid YAML detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          base_dir: ${{ github.workspace }}/tests/fixtures/invalid
          json_extension: ".nojson"
          mode: "warn"
          use_gitignore: "false"
          use_dot_match: "false"

      - name: Assert success output is false (invalid YAML detected)
        env:
          ACTUAL: ${{ steps.action.outputs.success }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected success=false but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
