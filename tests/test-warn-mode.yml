name: Test warn mode with invalid files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid JSON fixture file
        run: |
          mkdir -p tests/fixtures/warn-mode
          cat > tests/fixtures/warn-mode/bad.json << 'EOF'
          {
            "name": "test"
            "missing_comma": true
          }
          EOF

      - id: action
        uses: .
        with:
          base_dir: tests/fixtures/warn-mode
          mode: "warn"
          use_gitignore: "false"

      - name: Assert action step itself did not fail (warn mode)
        run: |
          echo "PASS: action completed without failing the step in warn mode"

      - name: Assert success output is false (validation failed but step did not error)
        env:
          ACTUAL: ${{ steps.action.outputs.success }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'false' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: warn mode correctly reports failure without failing the step"
