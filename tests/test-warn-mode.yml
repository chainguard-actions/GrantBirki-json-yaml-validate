name: Test warn mode with invalid files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          files: |
            tests/fixtures/invalid/bad.json
            tests/fixtures/invalid/bad.yaml
          use_gitignore: "false"
          mode: "warn"

      - name: Assert action succeeded in warn mode despite invalid files
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success: $SUCCESS"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed in warn mode but outcome was '$OUTCOME'"
            exit 1
          fi
          if [ "$SUCCESS" != "false" ]; then
            echo "FAIL: expected success=false (validation errors found) but got '$SUCCESS'"
            exit 1
          fi
          echo "PASS: action ran in warn mode and reported validation errors without failing"
