name: Test invalid JSON detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid JSON fixture file
        run: |
          mkdir -p tests/fixtures/invalid-json
          cat > tests/fixtures/invalid-json/bad.json << 'EOF'
          {
            "name": "test",
            "version": "1.0.0"
            "missing_comma": true
          }
          EOF

      - id: action
        uses: .
        with:
          base_dir: tests/fixtures/invalid-json
          mode: "warn"
          use_gitignore: "false"

      - name: Assert success output is false for invalid JSON
        env:
          ACTUAL: ${{ steps.action.outputs.success }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'false' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
