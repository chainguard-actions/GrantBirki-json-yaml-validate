name: Test invalid JSON detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          base_dir: ./tests/fixtures/invalid
          yaml_exclude_regex: ".*\\.yaml$"
          use_gitignore: "false"
          mode: "fail"
        continue-on-error: true

      - name: Assert action failed (invalid JSON detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success: $SUCCESS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid JSON, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid JSON"
