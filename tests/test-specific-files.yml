name: Test specific files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          files: |
            ${{ github.workspace }}/tests/fixtures/valid/sample.json
            ${{ github.workspace }}/tests/fixtures/valid/sample.yaml
            ${{ github.workspace }}/tests/fixtures/valid/sample.yml
          # Exclude YAML files from JSON validation (JSON validator processes all files in the list)
          json_exclude_regex: ".*\\.(yaml|yml)$"
          use_gitignore: "false"
          use_dot_match: "false"

      - name: Assert success output is true for specific valid files
        env:
          ACTUAL: ${{ steps.action.outputs.success }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected success=true but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
