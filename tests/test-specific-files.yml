name: Test specific files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test fixtures directory
        run: mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/specific-files"

      - name: Create valid JSON file
        run: |
          cat > "$GITHUB_WORKSPACE/tests/fixtures/specific-files/good.json" << 'EOF'
          {
            "key": "value",
            "number": 123
          }
          EOF

      - name: Create valid YAML file
        run: |
          cat > "$GITHUB_WORKSPACE/tests/fixtures/specific-files/good.yaml" << 'EOF'
          key: value
          number: 123
          EOF

      - id: action
        uses: .
        with:
          files: |
            tests/fixtures/specific-files/good.json
            tests/fixtures/specific-files/good.yaml
          use_gitignore: "false"

      - name: Assert success output is true
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "success: $SUCCESS"
          if [ "$SUCCESS" != "true" ]; then
            echo "FAIL: expected success=true for valid specific files but got '$SUCCESS'"
            exit 1
          fi
          echo "PASS"
