name: Test YAML validated as JSON with schema
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test fixtures directory
        run: mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/yaml-as-json"

      - name: Create JSON schema file
        run: |
          cat > "$GITHUB_WORKSPACE/tests/fixtures/yaml-as-json/schema.json" << 'EOF'
          {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "required": ["name"],
            "properties": {
              "name": {
                "type": "string"
              },
              "count": {
                "type": "integer"
              }
            },
            "additionalProperties": false
          }
          EOF

      - name: Create valid YAML file matching JSON schema
        run: |
          cat > "$GITHUB_WORKSPACE/tests/fixtures/yaml-as-json/config.yaml" << 'EOF'
          name: my-service
          count: 5
          EOF

      - id: action
        uses: .
        with:
          base_dir: "./tests/fixtures/yaml-as-json"
          json_schema: "./tests/fixtures/yaml-as-json/schema.json"
          json_exclude_regex: ".*schema\\.json$"
          yaml_as_json: "true"
          use_gitignore: "false"
          ajv_strict_mode: "false"

      - name: Assert success output is true
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "success: $SUCCESS"
          if [ "$SUCCESS" != "true" ]; then
            echo "FAIL: expected success=true for valid YAML matching JSON schema but got '$SUCCESS'"
            exit 1
          fi
          echo "PASS"
