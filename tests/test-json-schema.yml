name: Test JSON schema validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JSON schema and valid data fixture files
        run: |
          mkdir -p tests/fixtures/json-schema/data
          mkdir -p tests/fixtures/json-schema/schemas

          # Create a JSON schema
          cat > tests/fixtures/json-schema/schemas/schema.json << 'EOF'
          {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "required": ["name", "version"],
            "properties": {
              "name": {
                "type": "string"
              },
              "version": {
                "type": "string"
              },
              "enabled": {
                "type": "boolean"
              }
            },
            "additionalProperties": false
          }
          EOF

          # Create a valid JSON file that matches the schema
          cat > tests/fixtures/json-schema/data/valid.json << 'EOF'
          {
            "name": "my-app",
            "version": "2.0.0",
            "enabled": true
          }
          EOF

      - id: action
        uses: .
        with:
          base_dir: tests/fixtures/json-schema/data
          json_schema: tests/fixtures/json-schema/schemas/schema.json
          json_schema_version: "draft-07"
          use_gitignore: "false"

      - name: Assert success output is true for schema-valid JSON
        env:
          ACTUAL: ${{ steps.action.outputs.success }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
