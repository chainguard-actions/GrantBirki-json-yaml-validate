name: Test JSON schema validation with valid file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          files: ./tests/fixtures/schemas/valid-person.json
          json_schema: ./tests/fixtures/schemas/person.schema.json
          json_schema_version: "draft-07"
          use_gitignore: "false"

      - name: Assert success output is true
        env:
          ACTUAL: ${{ steps.action.outputs.success }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected success=true for valid file against schema, but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: valid file correctly passed schema validation"
